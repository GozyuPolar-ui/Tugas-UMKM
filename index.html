<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toko">
    <div class="wrap">
      <div class="toko-baris">
        <h1 id="toko-nama"></h1>
        <a class="btn-login" href="admin/login.html">Masuk penjual</a>
      </div>
      <p id="toko-tagline"></p>
      <p class="alamat" id="toko-alamat"></p>
    </div>
  </header>

  <main class="wrap">
    <div id="daftar" aria-live="polite"></div>
  </main>
    <footer class="footer">
    <div class="wrap">
      <div class="sosmed">
        <a id="link-ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
        <a id="link-wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </a>
      </div>
      <p><a class="tautan-dokumen" href="ui-ux.html">Penjelasan UI/UX</a></p>
      <p class="hak-cipta">&copy; <span id="tahun"></span> <span id="footer-nama"></span>. Pesanan dikonfirmasi lewat WhatsApp.</p>
    </div>
  </footer>

  <dialog id="modal" aria-labelledby="judul">
    <button type="button" class="tutup" id="tutup" aria-label="Tutup">&times;</button>
    <div id="isi"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/katalog.js"></script>
</body>
</html>
