<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="toko">
    <div class="wrap">
      <h1 id="toko-nama"></h1>
      <p id="toko-tagline"></p>
      <p class="alamat" id="toko-alamat"></p>
    </div>
  </header>

  <main class="wrap">
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>
  <footer class="wrap footer">Pesanan dikonfirmasi lewat WhatsApp.</footer>

  <dialog id="modal" aria-labelledby="judul">
    <button type="button" class="tutup" id="tutup" aria-label="Tutup">&times;</button>
    <div id="isi"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/katalog.js"></script>
</body>
</html>
